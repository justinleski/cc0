name: cc0

# Local data services only. The API, worker, and frontend are not containers yet.
# Ports bind to 127.0.0.1. Stop with `docker compose stop` so named volumes stay.

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cc0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cc0_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-cc0}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cc0rustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cc0rustfs_local_password}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:2.37.12
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-cc0rustfs}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-cc0rustfs_local_password}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET: ${S3_BUCKET:-cc0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /root/.aws
        printf '%s\n' '[default]' 's3 =' '    addressing_style = path' > /root/.aws/config
        if aws s3api head-bucket --bucket "$$S3_BUCKET" --endpoint-url http://rustfs:9000; then
          exit 0
        fi
        aws s3api create-bucket --bucket "$$S3_BUCKET" --endpoint-url http://rustfs:9000
    restart: on-failure

volumes:
  pgdata:
  rustfs_data:
