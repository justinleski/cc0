name: cc0

# `docker compose up --build -d` starts the complete local stack.
# Ports bind to 127.0.0.1. Stop with `docker compose stop` so named volumes stay.

x-backend: &backend
  image: cc0-backend:local
  build:
    context: ./backend
  env_file:
    - path: .env
      required: false
  environment:
    MIGRATION_DATABASE_URL: postgresql://${POSTGRES_USER:-cc0}:${POSTGRES_PASSWORD:-cc0_local_password}@postgres:5432/${POSTGRES_DB:-cc0}
    DATABASE_URL: postgresql://cc0_api:${CC0_API_PASSWORD:-cc0_api_local_password}@postgres:5432/${POSTGRES_DB:-cc0}
    WORKER_DATABASE_URL: postgresql://cc0_worker:${CC0_WORKER_PASSWORD:-cc0_worker_local_password}@postgres:5432/${POSTGRES_DB:-cc0}
    OBJECT_STORE_ENDPOINT: http://rustfs:9000
    # Export download links are presigned for the host the browser reaches,
    # not the compose-internal rustfs name.
    OBJECT_STORE_PUBLIC_ENDPOINT: http://127.0.0.1:${RUSTFS_API_PORT:-9000}

services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cc0}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cc0_local_password}
      POSTGRES_DB: ${POSTGRES_DB:-cc0}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.1
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-cc0rustfs}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-cc0rustfs_local_password}
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CHECK_UPDATE: "false"
      RUSTFS_OBS_LOGGER_LEVEL: error
    ports:
      - "127.0.0.1:${RUSTFS_API_PORT:-9000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-9001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health/ready"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  rustfs-init:
    image: amazon/aws-cli:2.37.12
    depends_on:
      rustfs:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-cc0rustfs}
      AWS_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-cc0rustfs_local_password}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      S3_BUCKET: ${S3_BUCKET:-cc0}
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        mkdir -p /root/.aws
        printf '%s\n' '[default]' 's3 =' '    addressing_style = path' > /root/.aws/config
        if head_output=$$(aws s3api head-bucket --bucket "$$S3_BUCKET" --endpoint-url http://rustfs:9000 2>&1); then
          echo "RustFS bucket $$S3_BUCKET already exists"
          exit 0
        fi
        case "$$head_output" in
          *"(404) when calling the HeadBucket operation"*|*"(NoSuchBucket) when calling the HeadBucket operation"*)
            echo "RustFS bucket $$S3_BUCKET is missing; creating it"
            ;;
          *)
            printf '%s\n' "$$head_output" >&2
            exit 1
            ;;
        esac
        aws s3api create-bucket --bucket "$$S3_BUCKET" --endpoint-url http://rustfs:9000
        aws s3api head-bucket --bucket "$$S3_BUCKET" --endpoint-url http://rustfs:9000
        echo "RustFS bucket $$S3_BUCKET is ready"
    restart: on-failure

  migrate:
    <<: *backend
    command: ["alembic", "-c", "backend/alembic.ini", "upgrade", "head"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    <<: *backend
    depends_on:
      migrate:
        condition: service_completed_successfully
      rustfs-init:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/v1/ready', timeout=5).close()"]
      interval: 5s
      timeout: 7s
      retries: 12
      start_period: 5s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      CATALOG_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
  rustfs_data:
