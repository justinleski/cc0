[project]
name = "cc0"
version = "0.1.0"
description = "CC0 visual boards API"
requires-python = ">=3.12"
dependencies = [
    "alembic==1.16.5",
    "boto3==1.40.61",
    "fastapi==0.119.0",
    # Source requests in the ingestion worker, and the FastAPI test client.
    "httpx==0.28.1",
    # Bounded image decode and thumbnail generation.
    "pillow==12.0.0",
    "psycopg[binary]==3.2.10",
    "pydantic-settings==2.11.0",
    "PyJWT==2.10.1",
    "python-dotenv==1.2.4",
    "sqlalchemy==2.0.44",
    "uvicorn==0.37.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.4.2",
    "ruff==0.14.0",
]
# Real image/text embeddings. Not installed by CI. The manual smoke command is
# `python -m app.embeddings` after `pip install -e "backend[embeddings]"`.
embeddings = [
    "open-clip-torch==2.32.0",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
# Default run needs no Docker. Integration tests are an explicit path and fail
# when the stack is down: `pytest tests/integration`.
testpaths = ["tests/unit"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
